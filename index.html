-.<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarkovLab Mini</title>
  <style>
    body { font: 18px system-ui; max-width: 420px; margin: 40px auto; padding: 0 20px; }
    label, input, button, output { display: block; margin: 12px 0; }
    input, button { font: inherit; padding: 10px; }
  </style>
</head>
<body>
  <h1>MarkovLab Mini.</h1>
  <form id="calculator">
    <label for="probability">Введите долю от 0 до 1</label>
    <input id="probability" inputmode="decimal" placeholder="Например, 0,5263">
    <button>Перевести в проценты</button>
    <output id="result" aria-live="polite"></output>
  </form>

  <script>
    const form = document.querySelector('#calculator');
    const input = document.querySelector('#probability');
    const result = document.querySelector('#result');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim().replace(',', '.');
      const value = Number(text);

      if (!text || !Number.isFinite(value) || value < 0 || value > 1) {
        result.textContent = 'Введите число от 0 до 1.';
        return;
      }

      result.textContent = value.toLocaleString('ru-RU', {
        style: 'percent',
        maximumFractionDigits: 6
      });
    });
  </script>
</body>
</html>
